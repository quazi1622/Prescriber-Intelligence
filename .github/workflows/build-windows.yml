name: Build portable Windows application
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify installed runtime dependencies
        shell: pwsh
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import cryptography, duckdb, openpyxl, PySide6; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey; print('Runtime dependencies and Ed25519 available; cryptography=' + cryptography.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Python syntax
        run: python -m compileall -q app tests cloudflare
      - name: Validate Cloudflare Worker syntax
        working-directory: cloudflare
        run: node --check src/index.js
      - name: Run all regression tests and capture logs
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath test-results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Embed public licensing configuration
        env:
          PI_WORKER_URL: ${{ secrets.PI_WORKER_URL }}
          PI_PUBLIC_KEY_B64: ${{ secrets.PI_PUBLIC_KEY_B64 }}
        run: python cloudflare/write_client_config.py
      - name: Include per-user installation script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installers | Out-Null
      - name: Package portable application and capture logs
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name Prescriber_Intelligence --paths app --collect-all duckdb app/main.py 2>&1 | Tee-Object -FilePath packaging-results.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item installers/install_for_user.cmd dist/Prescriber_Intelligence/Install-for-current-user.cmd
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Prescriber-Intelligence-Build-Diagnostics
          path: |
            test-results.log
            packaging-results.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Prescriber-Intelligence-Windows-Portable
          path: dist/Prescriber_Intelligence/
          if-no-files-found: error
