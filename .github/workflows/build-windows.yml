name: Build portable Windows application
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Package portable application
        run: pyinstaller --noconfirm --clean --onedir --windowed --name Prescriber_Intelligence --paths app --collect-all duckdb app/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Prescriber-Intelligence-Windows-Portable
          path: dist/Prescriber_Intelligence/
          if-no-files-found: error
